name: Bug report
description: Report a reproducible problem in view-calipers
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include reproduction steps and expected behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: App version, Windows version, GPU, file format, FFmpeg / Blender versions if relevant.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Minimal sample or screenshot
      description: Optional. Please do not attach private media or credentials.
