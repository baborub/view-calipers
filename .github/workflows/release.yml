name: Draft Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate tag and release notes
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'view-calipers').version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match Cargo version' }
          if (!(Test-Path "docs/releases/$env:GITHUB_REF_NAME.md")) { throw 'Missing release notes' }
      - name: Test
        run: >-
          cargo test --release --locked --
          --skip all_formats_import_geometry_and_render_nonempty_thumbnails
          --skip video_in_folder_has_thumbnail_playback_pause_and_seek
          --skip portrait_and_rotation_metadata_keep_same_geometry_during_playback_and_seek
          --skip split_preview_plays_both_videos_and_pauses_each_independently
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(Get-ChildItem dist -File | ForEach-Object FullName)
          gh release create $tag @assets --draft --verify-tag --title "view-calipers $tag" --notes-file "docs/releases/$tag.md" --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
