name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests without external FFmpeg and Blender
        run: >-
          cargo test --release --locked --
          --skip all_formats_import_geometry_and_render_nonempty_thumbnails
          --skip video_in_folder_has_thumbnail_playback_pause_and_seek
          --skip portrait_and_rotation_metadata_keep_same_geometry_during_playback_and_seek
          --skip split_preview_plays_both_videos_and_pauses_each_independently
      - name: Build and package
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: view-calipers-windows-x64
          path: dist/*
          if-no-files-found: error
